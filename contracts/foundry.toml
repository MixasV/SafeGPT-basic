[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]
remappings = ["forge-std/=lib/forge-std/src/"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"